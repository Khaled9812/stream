{% extends "base.html" %}

{% block title %}Add Client{% endblock %}

{% block styles %}
<style>
    .add-form {
        max-width: 500px;
        margin: 0 auto;
        background: #333;
        padding: 2rem;
        border-radius: 10px;
        border: 2px solid var(--primary-color);
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    label {
        display: block;
        margin-bottom: 0.5rem;
        color: #ccc;
    }
    input {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #444;
        background: #222;
        color: white;
    }
    button[type="submit"] {
        width: 100%;
        padding: 12px;
        background: var(--primary-color);
        border: none;
        border-radius: 5px;
        color: white;
        cursor: pointer;
    }
    .back-link {
        display: block;
        text-align: center;
        margin-top: 1.5rem;
        color: var(--primary-color);
    }
</style>
{% endblock %}

{% block content %}
<div class="add-form">
    <h1>Add New Client</h1>
    <form method="post">
        <div class="form-group">
            <label for="client_ip">Client IP Address</label>
            <input type="text" id="client_ip" name="client_ip" required>
        </div>
        <div class="form-group">
            <label for="client_tcp_port">Client TCP Port</label>
            <input type="number" id="client_tcp_port" name="client_tcp_port" required>
        </div>
        <div class="form-group">
            <label for="client_name">Client Name</label>
            <input type="text" id="client_name" name="client_name" required>
        </div>
        <div class="form-group">
            <label for="server_udp_port">Server UDP Port</label>
            <input type="number" id="server_udp_port" name="server_udp_port" required>
        </div>
        <button type="submit">Connect Client</button>
    </form>
    <a href="{{ url_for('index') }}" class="back-link">Back to Home</a>
</div>
{% endblock %}
